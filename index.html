<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Best of ESC</title>
<style>
  :root {
    --bg: #14111f;
    --fg: #f3f0ff;
    --muted: #9c95b8;
    --accent: #ff4fa3;
    --accent-2: #7c5cff;
    --card: #1f1a33;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f3ff;
      --fg: #1c1633;
      --muted: #6b6488;
      --card: #ffffff;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    text-align: center;
  }
  main { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
  @font-face {
    font-family: "Grozan";
    src: local("Grozan"), url("grozan.woff2") format("woff2"), url("grozan.ttf") format("truetype");
    font-display: swap;
  }
  h1 {
    margin: 0; font-family: "Grozan", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: clamp(40px, 12vw, 56px); line-height: 1.1; letter-spacing: .02em;
    color: var(--fg); font-weight: 800;
  }

  #play {
    width: 200px; height: 200px; border-radius: 50%;
    border: 0; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 12px 40px rgba(124, 92, 255, .45);
    display: grid; place-items: center;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  #play:active { transform: scale(.95); }
  #play:disabled { opacity: .4; cursor: default; box-shadow: none; }
  #play svg { width: 84px; height: 84px; fill: currentColor; }
  #play.playing { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 12px 40px rgba(124, 92, 255, .45); }
    50% { box-shadow: 0 12px 60px rgba(255, 79, 163, .7); }
  }
  @media (prefers-reduced-motion: reduce) { #play.playing { animation: none; } }

  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font: inherit; font-size: 16px; font-weight: 600;
    padding: 12px 22px; border-radius: 999px; cursor: pointer;
    border: 2px solid var(--muted); background: transparent; color: var(--fg);
  }
  .btn:active { transform: scale(.97); }
  .btn[hidden] { display: none; }

  #msg { min-height: 1.4em; color: var(--muted); font-size: 15px; margin: 0; }
  #msg.error { color: #ff6b6b; }

  form { display: flex; gap: 8px; }
  input {
    font: inherit; padding: 10px 14px; border-radius: 999px; width: 140px; text-align: center;
    border: 2px solid var(--muted); background: transparent; color: var(--fg);
  }
  form[hidden] { display: none; }

  /* YouTube-Player: ausserhalb des Bildschirms, nie sichtbar */
  #yt-wrap { position: fixed; left: -1000px; top: 0; width: 200px; height: 200px; overflow: hidden; pointer-events: none; }
</style>
</head>
<body>
<main>
  <h1>Best of ESC</h1>

  <button id="play" aria-label="Abspielen" disabled>
    <svg id="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
  </button>

  <p id="msg" role="status" aria-live="polite">Lade …</p>

  <div class="row">
    <button id="restart" class="btn" hidden>Von vorn</button>
  </div>

  <form id="manual" hidden>
    <input id="manual-id" inputmode="numeric" placeholder="ID" aria-label="ID" autocomplete="off">
    <button class="btn" type="submit">Los</button>
  </form>
</main>

<div id="yt-wrap"><div id="yt"></div></div>

<script>
(function () {
  "use strict";

  var ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  var ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  var ICON_REPLAY = '<path d="M12 5V1L7 6l5 5V7c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/>';

  var $ = function (id) { return document.getElementById(id); };
  var playBtn = $("play"), icon = $("icon"), msg = $("msg");
  var restartBtn = $("restart");

  var song = null, player = null, apiReady = false, started = false, ended = false;

  function setMsg(text, isError) {
    msg.textContent = text || "";
    msg.className = isError ? "error" : "";
  }
  function setIcon(path, label) {
    icon.innerHTML = path;
    playBtn.setAttribute("aria-label", label);
  }

  /* ---- ID aus der URL: ?id=042 (auch #042 oder /042 wird nicht benötigt) ---- */
  var params = new URLSearchParams(location.search);
  var id = (params.get("id") || "").trim();

  /* ID-Eingabe: immer sichtbar, auch auf der Seite eines einzelnen Songs */
  $("manual").hidden = false;
  $("manual").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("manual-id").value.trim();
    if (v) location.search = "?id=" + encodeURIComponent(v);
  });

  if (!id) {
    setMsg("");
    return;
  }

  /* ---- YouTube IFrame API laden ---- */
  window.onYouTubeIframeAPIReady = function () { apiReady = true; init(); };
  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  tag.onerror = function () { setMsg("YouTube konnte nicht geladen werden.", true); };
  document.head.appendChild(tag);

  /* ---- Songliste laden ---- */
  fetch("songs.json", { cache: "no-cache" })
    .then(function (r) {
      if (!r.ok) throw new Error("songs.json: " + r.status);
      return r.json();
    })
    .then(function (list) {
      var found = (Array.isArray(list) ? list : []).filter(function (s) {
        return String(s.id) === id;
      })[0];
      if (!found) { setMsg("ID „" + id + "“ nicht gefunden.", true); return; }
      song = found;
      init();
    })
    .catch(function () {
      setMsg("Songliste konnte nicht geladen werden. (Lokal testen? Dann einen Webserver nutzen.)", true);
    });

  function init() {
    if (!song || !apiReady || player) return;
    player = new YT.Player("yt", {
      height: "200", width: "200", videoId: song.youtube,
      playerVars: { playsinline: 1, controls: 0, disablekb: 1, fs: 0, rel: 0, modestbranding: 1, iv_load_policy: 3 },
      events: {
        onReady: function () {
          playBtn.disabled = false;
          setMsg("Tippe zum Abspielen.");
        },
        onStateChange: onState,
        onError: function () {
          playBtn.disabled = true;
          setMsg("Dieses Video lässt sich nicht abspielen. Bitte anderes Video in songs.json eintragen.", true);
        }
      }
    });
  }

  function load() {
    var opts = { videoId: song.youtube, startSeconds: Number(song.start) || 0 };
    if (song.end) opts.endSeconds = Number(song.end);
    player.loadVideoById(opts);
    started = true; ended = false;
  }

  function onState(e) {
    var S = YT.PlayerState;
    if (e.data === S.PLAYING) {
      playBtn.classList.add("playing");
      setIcon(ICON_PAUSE, "Pause");
      setMsg("");
      restartBtn.hidden = false;
    } else if (e.data === S.PAUSED) {
      playBtn.classList.remove("playing");
      setIcon(ICON_PLAY, "Weiter abspielen");
    } else if (e.data === S.ENDED) {
      ended = true;
      playBtn.classList.remove("playing");
      setIcon(ICON_REPLAY, "Nochmal abspielen");
      restartBtn.hidden = false;
    }
  }

  playBtn.addEventListener("click", function () {
    if (!player || !player.getPlayerState) return;
    var S = YT.PlayerState, st = player.getPlayerState();
    if (!started || ended) { load(); }
    else if (st === S.PLAYING || st === S.BUFFERING) { player.pauseVideo(); }
    else { player.playVideo(); }
  });

  restartBtn.addEventListener("click", function () { if (player) load(); });

})();
</script>
</body>
</html>
